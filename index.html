<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BACKTOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        @property --c1 {
            syntax: '<color>';
            inherits: true;
            initial-value: #f3f1ec
        }

        @property --c2 {
            syntax: '<color>';
            inherits: true;
            initial-value: #c9c5bb
        }

        @property --fg {
            syntax: '<color>';
            inherits: true;
            initial-value: #111
        }

        :root {
            --e: cubic-bezier(.2, .8, .2, 1);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        /* مود الكافيه (الأساسي): لاتيه هادي */
        body[data-m=cafe] {
            --c1: #f0e4d3;
            --c2: #c8ab8b;
            --fg: #2b1c12
        }

        /* المود الأبيض */
        body[data-m=white] {
            --c1: #ffffff;
            --c2: #e8e6e2;
            --fg: #111
        }

        body.home[data-m] {
            --c1: #111;
            --fg: #fff
        }

        html,
        body {
            height: auto
        }

        body {
            margin: 0;
            min-height: 100svh;
            color: var(--fg);
            background: radial-gradient(120% 95% at 50% 38%, var(--c1), var(--c2)) fixed;
            transition: --c1 .5s, --c2 .5s, --fg .5s;
            font-family: Inter, Cairo, sans-serif;
            overflow-x: hidden
        }

        [lang=ar] body {
            font-family: Cairo, Inter, sans-serif
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer
        }

        a {
            color: inherit;
            text-decoration: none
        }

        /* هبقى ارجع اظبط الشاشة عشان تشتغل على تابلت و تليفون */
        #hbg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: #111;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: opacity .5s, visibility .5s
        }

        #hbg::before {
            content: "";
            position: absolute;
            inset: -40px;
            background: url("img/home-bg.jpg") center/cover no-repeat;
            filter: blur(28px) brightness(.85)
        }

        #hbg .im {
            position: absolute;
            inset: 0;
            background: url("img/home-bg.jpg") center/contain no-repeat
        }

        #hbg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #0007, #0003 40%, #000a)
        }

        body.home #hbg {
            opacity: 1;
            visibility: visible
        }

        .app {
            position: relative;
            z-index: 1;
            min-height: 100svh;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: auto 1fr auto
        }

        .logo {
            width: clamp(96px, 9vw, 138px);
            aspect-ratio: 2.0772;
            display: block;
            object-fit: contain
        }

        body.home .logo {
            filter: invert(1) sepia(.2)
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 5vw;
            position: relative;
            z-index: 5
        }

        .nav {
            display: flex;
            gap: 4px;
            padding: 5px;
            border-radius: 99px;
            background: color-mix(in srgb, var(--fg) 8%, transparent);
            backdrop-filter: blur(12px)
        }

        .nav button {
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 500;
            transition: background .3s, color .3s
        }

        .nav button.on {
            background: var(--fg);
            color: var(--c1)
        }

        .nav button:not(.on):hover {
            background: color-mix(in srgb, var(--fg) 10%, transparent)
        }

        .ic {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .ib {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--fg) 8%, transparent);
            transition: background .3s
        }

        .ib:hover {
            background: color-mix(in srgb, var(--fg) 16%, transparent)
        }

        .ib svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .lang {
            width: auto;
            padding: 0 14px;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center
        }

        body[data-m=cafe] .i-sun,
        body[data-m=white] .i-cup {
            display: none
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr minmax(260px, 500px) 1fr;
            align-items: center;
            gap: 2vw;
            padding: 0 5vw
        }

        h1 {
            font: 600 clamp(36px, 4.6vw, 72px)/1.04 'Playfair Display', serif;
            margin: 0 0 18px;
            letter-spacing: -.02em
        }

        [lang=ar] h1 {
            font-family: Cairo, serif;
            line-height: 1.25;
            letter-spacing: 0
        }

        .txt p {
            max-width: 340px;
            font-size: 14px;
            line-height: 1.7;
            opacity: .72;
            margin: 0 0 26px
        }

        .cta {
            display: inline-flex;
            gap: 10px;
            align-items: center;
            padding: 13px 26px;
            border-radius: 99px;
            background: var(--fg);
            color: var(--c1);
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 30px -10px #0006;
            transition: transform .4s var(--e), box-shadow .4s
        }

        .cta:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 34px -12px #0008
        }

        [dir=rtl] .cta i {
            display: inline-block;
            transform: scaleX(-1)
        }

        body.home .hero {
            grid-template-columns: 1fr
        }

        body.home .stage,
        body.home .rt {
            visibility: hidden;
            position: absolute;
            pointer-events: none
        }

        body.home .txt {
            max-width: 640px
        }

        body.home h1 {
            font-size: clamp(44px, 6.4vw, 96px);
            text-shadow: 0 2px 24px #0006
        }

        body.home .txt p {
            max-width: 480px;
            font-size: 16px;
            opacity: .9
        }

        .rt {
            justify-self: end;
            text-align: end
        }

        .pr {
            font: 600 clamp(30px, 3.4vw, 48px)/1 'Playfair Display', serif
        }

        [lang=ar] .pr {
            font-family: Cairo
        }

        .old {
            text-decoration: line-through;
            opacity: .5;
            font-size: 18px;
            margin: 8px 0 18px
        }

        .lab {
            font-size: 12px;
            opacity: .65;
            margin-bottom: 10px
        }

        .sz {
            display: flex;
            gap: 8px;
            justify-content: flex-end
        }

        .sz button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            border: 1.5px solid color-mix(in srgb, var(--fg) 35%, transparent)
        }

        .sz button.on {
            background: var(--fg);
            color: var(--c1);
            border-color: var(--fg)
        }

        .nm {
            margin-top: 18px;
            font-size: 13px;
            opacity: .8
        }

        .stage {
            position: relative;
            display: grid;
            place-items: center;
            padding: 10px 0 44px;
            perspective: 900px
        }

        .pic {
            width: 100%;
            display: grid;
            place-items: center
        }

        #tilt {
            width: 100%;
            display: grid;
            place-items: center;
            transition: transform .25s ease-out;
            transform-style: preserve-3d
        }

        #fl {
            display: grid;
            place-items: center;
            max-width: 100%;
            animation: fl 5s ease-in-out infinite
        }

        @keyframes fl {
            50% {
                transform: translateY(-16px)
            }
        }

        #g {
            width: 100%;
            max-height: 56svh;
            display: block;
            object-fit: contain;
            cursor: pointer;
            filter: drop-shadow(0 20px 24px #0003)
        }

        #g.worn {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 56svh;
            aspect-ratio: auto;
            object-fit: contain;
            border-radius: 22px;
            filter: drop-shadow(0 14px 22px #0004)
        }

        .sd {
            width: 62%;
            height: 26px;
            margin: 6px auto 0;
            border-radius: 50%;
            background: radial-gradient(closest-side, #0009, transparent);
            filter: blur(6px);
            animation: sd 5s ease-in-out infinite
        }

        @keyframes sd {
            50% {
                transform: scale(.8);
                opacity: .6
            }
        }

        @media(prefers-reduced-motion:reduce) {

            #fl,
            .sd {
                animation: none
            }
        }

        .ar {
            position: absolute;
            inset: auto 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none
        }

        .ar button {
            pointer-events: auto;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: color-mix(in srgb, var(--fg) 10%, transparent);
            backdrop-filter: blur(8px);
            display: grid;
            place-items: center;
            transition: background .3s
        }

        .ar button:hover {
            background: var(--fg);
            color: var(--c1)
        }

        .ar .wr {
            width: auto;
            padding: 0 18px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600
        }

        .ar svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .ft {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            padding: 18px 5vw 26px
        }

        .so {
            display: flex;
            gap: 10px
        }

        .so a {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 1.5px solid color-mix(in srgb, var(--fg) 30%, transparent);
            transition: background .3s, color .3s
        }

        .so a:hover {
            background: var(--fg);
            color: var(--c1)
        }

        .so svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .so .f {
            fill: currentColor;
            stroke: none
        }

        .tg {
            font: 500 clamp(15px, 1.6vw, 20px)/1.35 'Playfair Display', serif;
            text-align: center
        }

        [lang=ar] .tg {
            font-family: Cairo
        }

        .nx {
            justify-self: end;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: color-mix(in srgb, var(--fg) 10%, transparent);
            display: grid;
            place-items: center
        }

        .nx img {
            width: 36px;
            height: 36px;
            object-fit: contain
        }

        body.home .nx {
            visibility: hidden
        }

        .abt {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            background: #0009;
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: all .3s;
            padding: 20px
        }

        .abt.o {
            opacity: 1;
            visibility: visible
        }

        .abt div {
            max-width: 460px;
            padding: 36px;
            border-radius: 26px;
            background: #f1e7d3;
            color: #111;
            text-align: center
        }

        .abt h2 {
            font: 600 28px 'Playfair Display', serif;
            margin: 0 0 12px
        }

        [lang=ar] .abt h2 {
            font-family: Cairo
        }

        .abt p {
            line-height: 1.8;
            font-size: 14px;
            margin: 0 0 20px
        }

        .abt button {
            padding: 11px 26px;
            border-radius: 99px;
            background: #111;
            color: #f1e7d3;
            font-weight: 600;
            font-size: 13px
        }

        .rv {
            animation: rv 1s var(--e) both;
            animation-delay: calc(2.2s + var(--d, 0s))
        }

        @keyframes rv {
            from {
                opacity: 0;
                transform: translateY(34px);
                filter: blur(8px)
            }
        }

        .ld {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: #0b0b0b;
            display: grid;
            place-items: center;
            animation: ld 1s var(--e) 1.7s forwards
        }

        .ld .logo {
            width: min(54vw, 300px);
            filter: invert(1) sepia(.2) !important;
            animation: lg 1.3s var(--e) .2s both
        }

        @keyframes lg {
            from {
                clip-path: inset(0 100% 0 0)
            }
        }

        @keyframes ld {
            to {
                clip-path: inset(0 0 100% 0);
                visibility: hidden
            }
        }

        @media(min-width:600px) and (max-width:860px) {
            .stage {
                max-width: 440px
            }
        }

        @media(max-width:860px) {

            .hero {
                grid-template-columns: minmax(0, 1fr)
            }

            .rt {
                order: 1
            }

            .txt {
                order: 2
            }

            body:not(.home) .txt h1,
            body:not(.home) .txt p {
                display: none
            }

            body:not(.home) .txt {
                padding: 16px 0 8px
            }

            .nm {
                margin-top: 12px
            }

            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 10px
            }

            .stage {
                order: -1;
                max-width: 340px;
                margin: 0 auto;
                width: 100%
            }

            .txt p,
            body.home .txt p {
                margin: 0 auto 22px
            }

            body.home .txt {
                margin: 0 auto
            }

            .rt {
                justify-self: center;
                text-align: center
            }

            .sz {
                justify-content: center
            }

            .nav {
                order: 3;
                width: 100%;
                flex-wrap: wrap;
                justify-content: center;
                border-radius: 24px
            }

            .nav button {
                padding: 8px 12px
            }

            .top {
                flex-wrap: wrap
            }

            .nav button {
                white-space: nowrap
            }

            .ft {
                grid-template-columns: 1fr;
                justify-items: center
            }

            .nx {
                display: none
            }

            .rv {
                animation-delay: calc(2s + var(--d, 0s))
            }
        }
    </style>
</head>

        // ===== اللينكات =====

        const IMG = {

        //=======  دي صور الموديلز =========
        const MODEL = {

            shirt:  { white: 'img/model-shirt-blue.png',  beige: 'img/model-shirt-red.png',  black: 'img/model-shirt-coffe.png' },
            hoodie: { white: 'img/model-hoodie-white.png', beige: 'img/model-hoodie-coffe.png', black: 'img/model-hoodie-black.png' },
            sweat:  { white: 'img/model-jeans-white.png',  beige: 'img/model-jeans-beige.png',  black: 'img/Amir eid.jpg' }
        };
        // ===== الأسعار: السعر, السعر القديم =====
        const P = { tee: [1200, 1600], shirt: [1500, 1900], hoodie: [2200, 2800], sweat: [1900, 2400] };
        // ================================================================

        const COL = ['white', 'beige', 'black'];
        //============ النصوص و ال nav bar ==================
        const T = {
            en: { home: 'Home', tee: 'T-shirts', shirt: 'Shirts', hoodie: 'Hoodies', sweat: 'Jeans', about: 'About Us', h1: 'Wear Confidence<br>Define Your Style.', sub: 'Discover premium T-shirts, shirts, hoodies and jeans designed for comfort, quality and everyday expression.', cta: 'Order now', shop: 'Shop now', size: 'Choose your size', tag: 'Dress Better.<br>Feel Better.', ah: 'About BACKTOM', ap: 'BACKTOM is a clothing brand built on clean cuts, soft premium fabrics and timeless colors. Simple pieces that make you feel as good as you look.', close: 'Close', cur: 'EGP', won: 'See on model', woff: 'Product view', c: { white: 'White', beige: 'Beige', black: 'Black' }, m: 'Hi BACKTOM, I want to order' },
            ar: { home: 'الرئيسية', tee: 'تيشيرتات', shirt: 'قمصان', hoodie: 'هوديز', sweat: 'جينز', about: 'من نحن', h1: 'ارتدِ الثقة<br>وحدّد أسلوبك.', sub: 'اكتشف تيشيرتات وقمصان وهوديز وجينز فاخرة، مصممة للراحة والجودة والتعبير عن نفسك كل يوم.', cta: 'اطلب الآن', shop: 'تسوّق الآن', size: 'اختر مقاسك', tag: 'البس أحسن.<br>واحسّ أحسن.', ah: 'عن BACKTOM', ap: 'باك تم براند ملابس قايم على القصّات النظيفة والخامات الناعمة الفاخرة والألوان الهادية. قطع بسيطة تخليك تحس بنفس شكلك.', close: 'إغلاق', cur: 'ج.م', won: 'شوفه على موديل', woff: 'صورة المنتج', c: { white: 'أبيض', beige: 'بيج', black: 'أسود' }, m: 'أهلاً باك تم، عايز أطلب' }
        };
        let lg = 'en', cat = 'tee', ci = 0, sz = 'M', home = true, worn = false, cur = 0;
        const $ = id => document.getElementById(id), t = () => T[lg], fmt = n => Math.round(n).toLocaleString(lg == 'ar' ? 'ar-EG' : 'en-US');

        const pre = o => Object.values(o).forEach(c => Object.values(c).forEach(s => new Image().src = s));
        pre(IMG); addEventListener('load', () => pre(MODEL));

        function lab() { $('wt').textContent = worn ? t().woff : t().won }
        function show() {
            document.body.classList.toggle('home', home);
            const g = $('g'); g.classList.toggle('worn', worn);
            g.src = (worn ? MODEL : IMG)[cat][COL[ci]]; lab()
        }
        $('g').onerror = () => { if (worn) { worn = false; show() } };

        document.querySelectorAll('#so a').forEach(a => a.href = L[a.dataset.k]);
        $('sz').innerHTML = ['S', 'M', 'L', 'XL'].map(s => `<button data-s="${s}" class="${s == sz ? 'on' : ''}">${s}</button>`).join('');
        function tx() { document.querySelectorAll('[data-i]').forEach(e => e.innerHTML = t()[e.dataset.i]); info() }
        function info() {
            lab();
            if (home) { $('cta').firstElementChild.textContent = t().shop; $('cta').href = '#'; $('bag').href = L.whatsapp; return }
            const c = t().cur, a = lg == 'ar', [p, o] = P[cat], money = n => a ? fmt(n) + ' ' + c : c + ' ' + fmt(n);
            $('cta').firstElementChild.textContent = t().cta;
            $('nm').textContent = t()[cat] + ' · ' + t().c[COL[ci]];
            const msg = `${t().m}: ${t()[cat]} - ${t().c[COL[ci]]} - ${sz}`;
            $('cta').href = L.whatsapp + '?text=' + encodeURIComponent(msg); $('bag').href = $('cta').href;
            $('od').textContent = money(o);
            const f = cur, st = performance.now(); (function r(n) { const k = Math.min(1, (n - st) / 800), e = 1 - Math.pow(1 - k, 3); $('pr').textContent = money(f + (p - f) * e); if (k < 1) requestAnimationFrame(r); else cur = p })(st)
        }
        function swap(fn) { $('fl').animate([{ opacity: 1, filter: 'blur(0)', transform: 'scale(1)' }, { opacity: .15, filter: 'blur(14px)', transform: 'scale(.92)' }, { opacity: 1, filter: 'blur(0)', transform: 'scale(1)' }], { duration: 850, easing: 'ease-in-out' }); setTimeout(fn, 420) }
        function mini() { $('mp').src = IMG[cat][COL[(ci + 1) % COL.length]] }
        function setT() { info(); mini() }
        function go(n) { if (home) return; ci = (ci + n + COL.length) % COL.length; swap(show); setT() }
        function pills() { document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.c == (home ? 'home' : cat))) }
        function setHome() { home = true; worn = false; ci = 0; pills(); swap(show); setT() }
        function setCat(k) {
            if (!home && k == cat) return;
            if (k != cat) worn = false;
            home = false; cat = k; pills(); swap(show); info(); mini()
        }
        function toggleWorn() { if (home) return; worn = !worn; swap(show) }

        // ===== المود: كافيه (الأساسي) و أبيض =====
        let saved = null; try { saved = localStorage.getItem('theme') } catch (e) { }
        document.body.dataset.m = saved == 'white' ? 'white' : 'cafe';
        $('md').onclick = () => {
            const m = document.body.dataset.m == 'white' ? 'cafe' : 'white'; document.body.dataset.m = m;
            try { localStorage.setItem('theme', m) } catch (e) { }
        };

        $('nav').onclick = e => {
            const b = e.target.closest('button'); if (!b) return; const c = b.dataset.c;
            if (c == 'about') { $('ab').classList.add('o'); return }
            if (c == 'home') setHome(); else setCat(c)
        };
        $('cta').onclick = e => { if (home) { e.preventDefault(); setCat('tee') } };
        $('ac').onclick = () => $('ab').classList.remove('o'); $('ab').onclick = e => { if (e.target == $('ab')) $('ac').click() };
        $('pv').onclick = () => go(-1); $('nt').onclick = $('mn').onclick = () => go(1);
        $('wr').onclick = $('g').onclick = toggleWorn;
        $('sz').onclick = e => { const b = e.target.closest('button'); if (!b) return; sz = b.dataset.s; document.querySelectorAll('#sz button').forEach(x => x.classList.toggle('on', x == b)); info() };
        $('lang').onclick = () => { lg = lg == 'en' ? 'ar' : 'en'; const h = document.documentElement; h.lang = lg; h.dir = lg == 'ar' ? 'rtl' : 'ltr'; $('ll').textContent = lg == 'ar' ? 'EN' : 'ع'; cur = 0; tx() };
        addEventListener('mousemove', e => { const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5; $('tilt').style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 8}deg)` });
        addEventListener('keydown', e => { if (e.key == 'ArrowLeft') go(-1); if (e.key == 'ArrowRight') go(1) });
        show(); tx(); setT();
    </script>
</body>

</html>
